name: Culto de Dagon — navio final 4 quadros (V110)
on:
  pull_request:
    paths:
      - Game.js
      - SeaFactions.js
      - SeaMenus.js
      - PortUI.js
      - sw.js
      - assets/player/culto_dagon/**
      - tests/dagon-cult-final-v110.test.cjs
      - tests/dagon-cult-final-v110-visual.test.cjs
      - tests/sobreviventes-final-level20.test.cjs
      - .github/workflows/dagon-cult-final-v110.yml
  push:
    branches: [main]
    paths:
      - Game.js
      - SeaFactions.js
      - SeaMenus.js
      - PortUI.js
      - sw.js
      - assets/player/culto_dagon/**
      - tests/dagon-cult-final-v110.test.cjs
      - tests/dagon-cult-final-v110-visual.test.cjs
      - tests/sobreviventes-final-level20.test.cjs
permissions:
  contents: read
jobs:
  cult-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and pixel integrity
        run: |
          node --check Game.js
          node --check SeaFactions.js
          node --check SeaMenus.js
          node --check PortUI.js
          node tests/dagon-cult-final-v110.test.cjs
          node tests/sobreviventes-final-level20.test.cjs
      - name: Faction and save regressions
        run: |
          node tests/faction-council-v100.test.cjs
          node tests/player-ship-20-stages.test.cjs
          node tests/pwa-cache-contract.test.cjs
          node tests/port-ui-rebuild.test.cjs

  cult-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Gameplay on desktop and mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dagon-v110.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/dagon-cult-final-v110-visual.test.cjs
