name: Contratos — testes de regressão

on:
  push:
    paths:
      - 'Game.js'
      - 'SeaBoarding.js'
      - 'SeaContracts.js'
      - 'SeaContract*.js'
      - 'SeaIslands.js'
      - 'SeaSaveTransfer.js'
      - 'PortUI.js'
      - 'tests/**'
      - '.github/workflows/contract-tests.yml'
  pull_request:
    paths:
      - 'Game.js'
      - 'SeaBoarding.js'
      - 'SeaContracts.js'
      - 'SeaContract*.js'
      - 'SeaIslands.js'
      - 'SeaSaveTransfer.js'
      - 'PortUI.js'
      - 'tests/**'
      - '.github/workflows/contract-tests.yml'

jobs:
  contract-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abordagem de navios
        run: node tests/SeaBoarding.test.cjs
      - name: CT-001 — planejamento costeiro
        run: node tests/SeaConvoyNavigation.test.cjs
      - name: CT-001 — perseguicao fisica e prazo
        run: node tests/SeaConvoyChase.test.cjs
      - name: CT-001 — rotas e fuga
        run: node tests/SeaContractCT001.test.cjs
      - name: CT-001 — integração
        run: node tests/SeaContractCT001.integration.test.cjs
      - name: CT-001 — interface e telemetria
        run: node tests/SeaContractCT001.interface.test.cjs
      - name: Quadro, efeitos, saves e backups
        run: node tests/SeaContractPersistence.test.cjs
