name: Floating Chest — four-frame animation
on:
  pull_request:
    paths:
      - Game.js
      - sw.js
      - assets/items/treasure_chest.png
      - tests/floating-chest-four-frame.test.cjs
      - .github/workflows/floating-chest.yml
  push:
    branches: [main]
    paths:
      - Game.js
      - sw.js
      - assets/items/treasure_chest.png
      - tests/floating-chest-four-frame.test.cjs
permissions:
  contents: read
jobs:
  floating-chest-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check Game.js
          node tests/floating-chest-four-frame.test.cjs
          node tests/pwa-cache-contract.test.cjs
          node tests/kraken-rebirth-cycle.test.cjs
          node tests/tentacle-kraken-events.test.cjs
