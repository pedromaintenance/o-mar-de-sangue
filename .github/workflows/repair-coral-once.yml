name: One-time repair of coral sprite
on:
  push:
    branches: ['fix/3-8a4-coral-sprite-stray-strip']
    paths:
      - '.github/workflows/repair-coral-once.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Crop atlas strip from PNG with Python stdlib
        run: python3 tools/repair_coral_png.py assets/v15/beast_coral.png
      - name: Save repaired binary on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/v15/beast_coral.png
          if ! git diff --cached --quiet; then
            git commit -m "fix(asset): remove detached top scanlines from Coral Horror PNG"
            git push origin HEAD:fix/3-8a4-coral-sprite-stray-strip
          fi
