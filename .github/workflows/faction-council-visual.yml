name: Faction Council — visual desktop and mobile
on:
  push:
    branches: [main]
    paths:
      - 'SeaFactions.js'
      - 'Game.js'
      - 'PortUI.js'
      - 'PortUI.css'
      - 'index.html'
      - 'tests/faction-council-visual.test.cjs'
      - '.github/workflows/faction-council-visual.yml'
  pull_request:
    paths:
      - 'SeaFactions.js'
      - 'Game.js'
      - 'PortUI.js'
      - 'PortUI.css'
      - 'index.html'
      - 'tests/faction-council-visual.test.cjs'
      - '.github/workflows/faction-council-visual.yml'
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Play game from local website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/factions-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/faction-council-visual.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faction-council-screenshots
          path: port-artifacts/factions-*.png
          if-no-files-found: ignore
