name: Faction Politics V101 — contracts and patrols
on:
  push:
    branches: [main]
    paths:
      - 'SeaFactionPolitics.js'
      - 'SeaContracts.js'
      - 'SeaIslandRules.js'
      - 'SeaPoliticalEvents.js'
      - 'Game.js'
      - 'PortUI.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/faction-politics-v101.test.cjs'
      - 'tests/faction-politics-visual.test.cjs'
      - 'tests/faction-council-v100.test.cjs'
      - '.github/workflows/faction-politics-v101.yml'
  pull_request:
    paths:
      - 'SeaFactionPolitics.js'
      - 'SeaContracts.js'
      - 'SeaIslandRules.js'
      - 'SeaPoliticalEvents.js'
      - 'Game.js'
      - 'PortUI.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/faction-politics-v101.test.cjs'
      - '.github/workflows/faction-politics-v101.yml'
permissions:
  contents: read
jobs:
  politics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources and faction mechanics
        run: |
          node --check SeaFactionPolitics.js
          node --check SeaContracts.js
          node --check Game.js
          node --check PortUI.js
          node --test tests/faction-politics-v101.test.cjs
      - name: Regression — contract and island foundations
        run: |
          node --test tests/faction-council-v100.test.cjs tests/island-gameplay-v99.test.cjs tests/player-ship-20-stages.test.cjs tests/pwa-cache-contract.test.cjs

  visual:
    needs: politics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Test commissioned voyages on desktop and mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/faction-politics.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/faction-politics-visual.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faction-politics-screenshots
          path: port-artifacts/commission-*.png
          if-no-files-found: ignore
