name: Laboratory — Island Events Pages
on:
  push:
    branches: [main]
    paths:
      - 'laboratorio-ilhas/**'
      - 'tests/laboratorio-ilhas-pages.test.cjs'
      - '.github/workflows/laboratorio-ilhas-pages.yml'
  pull_request:
    paths:
      - 'laboratorio-ilhas/**'
      - 'tests/laboratorio-ilhas-pages.test.cjs'
      - '.github/workflows/laboratorio-ilhas-pages.yml'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/laboratorio-ilhas-pages.test.cjs
