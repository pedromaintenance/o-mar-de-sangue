name: Port UI smoke and visual tests
# Avoid queues of obsolete visual runs during active UI iteration.
concurrency:
  group: port-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - 'PortUI.js'
      - 'SeaSaveTransfer.js'
      - 'tests/save-restore-3-6c.test.cjs'
      - 'PortUI.css'
      - 'PortThemeAbyss.css'
      - 'index.html'
      - 'sw.js'
      - 'PwaStatus.js'
      - 'style.css'
      - 'tests/pwa-status-3-6.test.cjs'
      - 'tests/pwa-cache-contract.test.cjs'
      - 'tests/pwa-offline-visual.test.cjs'
      - 'Game.js'
      - 'SeaPerformance.js'
      - 'tests/performance-3-6g.test.cjs'
      - 'tests/performance-report-3-6h.test.cjs'
      - 'tests/effect-budget-3-6l.test.cjs'
      - 'tests/fps-normalization-3-6l1.test.cjs'
      - 'SeaPerformanceCompare.js'
      - 'tests/performance-compare-3-6i.test.cjs'
      - 'SeaMenus.js'
      - 'SeaIslands.js'
      - 'SeaEffects.js'
      - 'SeaWeather.js'
      - 'tests/soundscape-3-5.test.cjs'
      - 'tests/weather-redraw-cache-3-6j.test.cjs'
      - 'SeaPixelPolish.js'
      - 'tests/procedural-sea-cache-3-6k.test.cjs'
      - 'tests/audio-mixer-3-5b.test.cjs'
      - 'tests/port-ui-rebuild.test.cjs'
      - 'tests/port-visual.test.cjs'
      - 'tests/port-theme-abyss.test.cjs'
      - 'tests/port-controller-navigation.test.cjs'
      - 'tests/mare-negra-overlays.test.cjs'
      - 'tests/mare-negra-overlays-visual.test.cjs'
      - 'tests/mare-negra-hud.test.cjs'
      - 'tests/mare-negra-hud-visual.test.cjs'
      - 'tests/political-parley.test.cjs'
      - 'tests/political-parley-visual.test.cjs'
      - 'SeaAtlas.js'
      - 'SeaContracts.js'
      - 'SeaGunnery.js'
      - 'SeaImpulse.js'
      - 'tests/naval-impulse-3-8b.test.cjs'
      - 'SeaCannonChargeFx.js'
      - 'assets/fx/cannon_charge_sparks.png'
      - 'assets/v15/beast_coral.png'
      - 'tests/coral-asset-3-8a4.test.cjs'
      - 'tests/gunnery-windup-3-8a.test.cjs'
      - 'tests/gunnery-single-shot-3-8a1.test.cjs'
      - 'tests/braced-gunnery-3-8a2.test.cjs'
      - 'tests/cannon-charge-sparks-3-8a3.test.cjs'
      - 'tests/cannon-sparks-luminous-3-8a5.test.cjs'
      - 'tests/rescue-contract-3-7a.test.cjs'
      - 'tests/smuggling-contract-3-7a2.test.cjs'
      - 'tests/hunt-contract-3-7a3.test.cjs'
      - 'tests/hunt-contract-visual-3-7a3.test.cjs'
      - 'tests/atlas-chart.test.cjs'
      - 'tests/atlas-chart-visual.test.cjs'
      - '.github/workflows/port-ui.yml'
  pull_request:
    paths:
      - 'SeaMenus.js'
      - 'SeaIslands.js'
      - 'SeaEffects.js'
      - 'SeaWeather.js'
      - 'tests/soundscape-3-5.test.cjs'
      - 'tests/weather-redraw-cache-3-6j.test.cjs'
      - 'SeaPixelPolish.js'
      - 'tests/procedural-sea-cache-3-6k.test.cjs'
      - 'tests/audio-mixer-3-5b.test.cjs'
      - 'ROADMAP.md'
      - 'PortUI.js'
      - 'SeaSaveTransfer.js'
      - 'tests/save-restore-3-6c.test.cjs'
      - 'PortUI.css'
      - 'PortThemeAbyss.css'
      - 'index.html'
      - 'sw.js'
      - 'PwaStatus.js'
      - 'style.css'
      - 'tests/pwa-status-3-6.test.cjs'
      - 'tests/pwa-cache-contract.test.cjs'
      - 'tests/pwa-offline-visual.test.cjs'
      - 'Game.js'
      - 'SeaPerformance.js'
      - 'tests/performance-3-6g.test.cjs'
      - 'tests/performance-report-3-6h.test.cjs'
      - 'tests/effect-budget-3-6l.test.cjs'
      - 'tests/fps-normalization-3-6l1.test.cjs'
      - 'SeaPerformanceCompare.js'
      - 'tests/performance-compare-3-6i.test.cjs'
      - 'tests/port-ui-rebuild.test.cjs'
      - 'tests/port-visual.test.cjs'
      - 'tests/port-theme-abyss.test.cjs'
      - 'tests/port-controller-navigation.test.cjs'
      - 'tests/mare-negra-overlays.test.cjs'
      - 'tests/mare-negra-overlays-visual.test.cjs'
      - 'tests/mare-negra-hud.test.cjs'
      - 'tests/mare-negra-hud-visual.test.cjs'
      - 'tests/political-parley.test.cjs'
      - 'tests/political-parley-visual.test.cjs'
      - 'SeaAtlas.js'
      - 'SeaContracts.js'
      - 'SeaGunnery.js'
      - 'SeaImpulse.js'
      - 'tests/naval-impulse-3-8b.test.cjs'
      - 'SeaCannonChargeFx.js'
      - 'assets/fx/cannon_charge_sparks.png'
      - 'assets/v15/beast_coral.png'
      - 'tests/coral-asset-3-8a4.test.cjs'
      - 'tests/gunnery-windup-3-8a.test.cjs'
      - 'tests/gunnery-single-shot-3-8a1.test.cjs'
      - 'tests/braced-gunnery-3-8a2.test.cjs'
      - 'tests/cannon-charge-sparks-3-8a3.test.cjs'
      - 'tests/cannon-sparks-luminous-3-8a5.test.cjs'
      - 'tests/rescue-contract-3-7a.test.cjs'
      - 'tests/smuggling-contract-3-7a2.test.cjs'
      - 'tests/hunt-contract-3-7a3.test.cjs'
      - 'tests/hunt-contract-visual-3-7a3.test.cjs'
      - 'tests/atlas-chart.test.cjs'
      - 'tests/atlas-chart-visual.test.cjs'
jobs:
  port-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and menu action contracts
        run: |
          node --check PortUI.js
          node --check SeaSaveTransfer.js
          node tests/save-restore-3-6c.test.cjs
          node --check Game.js
          node --check SeaPerformance.js
          node tests/performance-3-6g.test.cjs
          node tests/performance-report-3-6h.test.cjs
          node tests/effect-budget-3-6l.test.cjs
          node tests/fps-normalization-3-6l1.test.cjs
          node --check SeaPerformanceCompare.js
          node tests/performance-compare-3-6i.test.cjs
          node --check PwaStatus.js
          node tests/pwa-status-3-6.test.cjs
          node tests/pwa-cache-contract.test.cjs
          node --check SeaEffects.js
          node --check SeaWeather.js
          node tests/weather-redraw-cache-3-6j.test.cjs
          node --check SeaPixelPolish.js
          node tests/procedural-sea-cache-3-6k.test.cjs
          node tests/soundscape-3-5.test.cjs
          node tests/audio-mixer-3-5b.test.cjs
          node --check SeaMenus.js
          node --check SeaIslands.js
          node tests/port-ui-rebuild.test.cjs
          node tests/port-controller-navigation.test.cjs
          node tests/mare-negra-overlays.test.cjs
          node tests/mare-negra-hud.test.cjs
          node tests/political-parley.test.cjs
          node --check SeaAtlas.js
          node tests/atlas-chart.test.cjs
          node --check SeaContracts.js
          node tests/rescue-contract-3-7a.test.cjs
          node tests/smuggling-contract-3-7a2.test.cjs
          node tests/hunt-contract-3-7a3.test.cjs
          node --check SeaGunnery.js
          node tests/gunnery-windup-3-8a.test.cjs
          node tests/gunnery-single-shot-3-8a1.test.cjs
          node tests/braced-gunnery-3-8a2.test.cjs
          node --check SeaImpulse.js
          node tests/naval-impulse-3-8b.test.cjs
          node --check SeaCannonChargeFx.js
          node tests/cannon-charge-sparks-3-8a3.test.cjs
          node tests/cannon-sparks-luminous-3-8a5.test.cjs
          node tests/coral-asset-3-8a4.test.cjs
  port-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Render screenshots and validate screen widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/port-ui-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/port-visual.test.cjs
          node tests/port-theme-abyss.test.cjs
          node tests/mare-negra-overlays-visual.test.cjs
          node tests/mare-negra-hud-visual.test.cjs
          node tests/political-parley-visual.test.cjs
          node tests/atlas-chart-visual.test.cjs
          node tests/hunt-contract-visual-3-7a3.test.cjs
          node tests/pwa-offline-visual.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-ui-screenshots
          path: port-artifacts/*.png
          if-no-files-found: ignore
