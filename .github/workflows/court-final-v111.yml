name: Corte Feérica — navio final em quatro quadros (V111)
on:
  pull_request:
    paths:
      - Game.js
      - SeaFactions.js
      - PortUI.js
      - sw.js
      - assets/player/corte_feerica/**
      - tests/court-final-v111.test.cjs
      - tests/court-final-v111-visual.test.cjs
      - tests/sobreviventes-final-level20.test.cjs
      - tests/dagon-cult-final-v110.test.cjs
      - .github/workflows/court-final-v111.yml
  push:
    branches: [main]
    paths:
      - Game.js
      - SeaFactions.js
      - PortUI.js
      - sw.js
      - assets/player/corte_feerica/**
      - tests/court-final-v111.test.cjs
      - tests/court-final-v111-visual.test.cjs
      - tests/sobreviventes-final-level20.test.cjs
      - tests/dagon-cult-final-v110.test.cjs
permissions:
  contents: read
jobs:
  court-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and sprite checks
        run: |
          node --check Game.js
          node --check SeaFactions.js
          node --check PortUI.js
          node tests/court-final-v111.test.cjs
          node tests/sobreviventes-final-level20.test.cjs
          node tests/dagon-cult-final-v110.test.cjs
      - name: Existing faction, world and save regressions
        run: |
          node tests/faction-council-v100.test.cjs
          node tests/corte-feerica-assets.test.cjs
          node tests/player-ship-20-stages.test.cjs
          node tests/world-scale-v109.test.cjs
          node tests/pwa-cache-contract.test.cjs
          node tests/port-ui-rebuild.test.cjs
  court-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Desktop and mobile game test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/court-v111-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/court-final-v111-visual.test.cjs
