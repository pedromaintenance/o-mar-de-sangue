name: Rebuild cannon sparks once
on:
  push:
    branches: ['fix/3-8a5-bright-cannon-ignition']
    paths:
      - '.github/workflows/rebuild-ignition-once.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Install image processor
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Clean the original on-main sprite
        run: |
          python3 tools/rebuild_cannon_sparks.py assets/fx/cannon_charge_sparks.png
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('assets/fx/cannon_charge_sparks.png').convert('RGBA')
          assert im.size==(480,96)
          for i in range(5):
              frame=im.crop((i*96,0,(i+1)*96,96))
              assert frame.getbbox(),i
          print("All five illuminated frames have content")
          PY
      - name: Commit verified sprite to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fx/cannon_charge_sparks.png
          git diff --cached --quiet || {
            git commit -m "fix(asset): deliver transparent luminous ignition atlas"
            git push origin HEAD:fix/3-8a5-bright-cannon-ignition
          }
