name: Sobreviventes — integrity of 20 player ship evolutions
on:
  push:
    paths:
      - 'assets/player/sobreviventes/**'
      - 'tests/sobreviventes-assets.test.cjs'
      - '.github/workflows/sobreviventes-assets.yml'
  pull_request:
    paths:
      - 'assets/player/sobreviventes/**'
      - 'tests/sobreviventes-assets.test.cjs'
      - '.github/workflows/sobreviventes-assets.yml'
permissions:
  contents: read
jobs:
  art-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/sobreviventes-assets.test.cjs
      - run: node tests/sobreviventes-assets.test.cjs
