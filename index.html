<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#220f18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="O Mar de Sangue" />
  <title>O Mar de Sangue</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Porto 3.0 — A Maré Negra is the official visual identity.
    // Legacy skin remains available by URL only: ?theme=classic.
    // This switch affects presentation exclusively, never game state.
    let classic = false;
    try {
      classic = new URLSearchParams(location.search).get('theme') === 'classic';
    } catch (_) { /* Default remains Maré Negra. */ }
    if (!classic) document.documentElement.classList.add('theme-mare-negra');
  </script>
  <link rel="stylesheet" href="PortUI.css" />
  <link rel="stylesheet" href="PortThemeAbyss.css" />
</head>
<body>
  <div id="app-shell">
    <div id="game-container"></div>
    <button id="install-btn" hidden>Instalar app</button>
  </div>
  <script src="phaser.min.js"></script>
  <script src="SeaEffects.js"></script>
  <script src="SeaWeather.js"></script>
  <script src="SeaMenus.js"></script>
  <script src="SeaIslands.js"></script>
  <script src="SeaPixelPolish.js"></script>
  <script src="PortUI.js"></script>
  <script src="Game.js"></script>
  <script>
    let deferredPrompt = null;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.hidden = false;
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.hidden = true;
    });

    window.addEventListener('appinstalled', () => {
      installBtn.hidden = true;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
    }
  </script>
</body>
</html>
